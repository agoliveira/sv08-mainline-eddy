# Sovol official eddy kit: a bare LDC1612 coil wired by I2C to the
# toolhead micro-controller (pins PB6 = SCL, PB7 = SDA).
# Uses mainline Klipper's native [probe_eddy_current]; no eddy-ng.

# Needed for the first calibration, before Z can be homed.
[force_move]
enable_force_move: True

[probe_eddy_current eddy]
sensor_type: ldc1612
i2c_mcu: extra_mcu
# Software I2C. The hardware bus (i2c_bus: i2c1, same pins) can lock up
# on this STM32F103 toolhead under mainline firmware.
i2c_software_scl_pin: extra_mcu:PB6
i2c_software_sda_pin: extra_mcu:PB7
# Height at which contactless homing and probing stop. Klipper suggests
# 0.5, but that leaves no room for plastic hanging from a nozzle that has
# not been cleaned yet. Sovol's own firmware stops at about 2.6 mm.
# Precise Z comes from the tap, not from this.
descend_z: 2.5
# Sovol's coil resonates near 8.5 MHz. Klipper's default (5 MHz) sets the
# LDC1612 input divider too low for it, which makes the readings too
# noisy to calibrate ("Failed calibration - No usable data").
max_sensor_hz: 10000000
x_offset: -16.43
y_offset: 10.22
# Tap samples must agree closely; a dirty nozzle shows up as scatter.
# reg_drive_current, the height calibration and tap_threshold are
# written by SAVE_CONFIG at the bottom of printer.cfg. Do not add them
# here: SAVE_CONFIG cannot update values that live in an included file.

[bed_mesh]
speed: 400
horizontal_move_z: 1.5
algorithm: bicubic
mesh_min: 13,15
mesh_max: 333,340
probe_count: 41,41
fade_start: 0
fade_end: 10
scan_overshoot: 4
# The mesh is zeroed at the point where START_PRINT taps the bed, so
# the tap result and the mesh share one reference.
zero_reference_position: 191,165

[quad_gantry_level]
gantry_corners:
    -60,-10
    410,420
points:
    36,10
    36,320
    346,320
    346,10
speed: 400
horizontal_move_z: 10
retry_tolerance: 0.05
retries: 5
max_adjust: 30

# Sensorless X/Y homing in a fixed order (Y, then X), then Z over the
# bed at X191 Y165. set_position_z lets the head lift 5 mm before
# homing even when Z is not homed yet.
[homing_override]
axes: xyz
set_position_z: 0
gcode:
    {% if not 'Z' in params and not 'Y' in params and 'X' in params %}
      G90
      G0 Z5 F300
      G28 X
      G0 X348 F1200
    {% elif not 'Z' in params and not 'X' in params and 'Y' in params %}
      G90
      G0 Z5 F300
      G28 Y
      G0 Y360 F1200
    {% elif not 'Z' in params and 'X' in params and 'Y' in params %}
      G90
      G0 Z5 F300
      G28 Y
      G0 Y360 F1200
      G4 P2000
      M400
      G28 X
      G0 X348 F1200
    {% elif 'Z' in params and not 'X' in params and not 'Y' in params %}
      G90
      G0 X191 Y165 F3600
      G28 Z
      G0 Z10 F600
    {% else %}
      G90
      G0 Z5 F300
      G28 Y
      G0 Y360 F1200
      G4 P2000
      M400
      G28 X
      G0 X348 F1200
      G90
      G0 X191 Y165 F3600
      G28 Z
      G0 Z10 F600
    {% endif %}
