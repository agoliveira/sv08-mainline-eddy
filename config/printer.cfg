# Sovol SV08 with the official Sovol eddy kit, on mainline Klipper.
# Converted from the Sovol stock configuration (firmware 2.4.9 eddy).
# See the guide in this repository before using it: the eddy probe
# must be calibrated before the printer can home Z or print.

[include mainsail.cfg]
[include lcd.cfg]
[include eddy.cfg]
[include macros.cfg]
# Optional, after installing moonraker-timelapse:
#[include timelapse.cfg]

#####################################################################
# Micro-controllers
#####################################################################
# The serials below are unique per board. Find yours with:
#   ls -l /dev/serial/by-id/
# and map them to the boards with:
#   ls -l /dev/serial/by-path/
# (platform-5200400 is the mainboard, platform-5101400 is the toolhead).
# WARNING: swapping the two serials can drive the wrong pins. Verify
# the temperature readings before enabling any heater.

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_MAINBOARD_SERIAL-if00
restart_method: command

[mcu extra_mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_TOOLHEAD_SERIAL-if00
restart_method: command

#####################################################################
# Printer
#####################################################################

[printer]
kinematics: corexy
max_velocity: 700
# Sovol ships 40000. This is only a ceiling; the slicer sets what is
# actually used. See the input shaper chapter before raising it.
max_accel: 20000
# Replaces Sovol's deprecated max_accel_to_decel setting.
minimum_cruise_ratio: 0.75
max_z_velocity: 20
max_z_accel: 500
square_corner_velocity: 5.0

[exclude_object]

[gcode_arcs]
resolution: 1.0

[idle_timeout]
gcode: _IDLE_TIMEOUT
timeout: 1800

#####################################################################
# X/Y steppers (sensorless homing)
#####################################################################

[stepper_x]
step_pin: PE2
dir_pin: !PE0
enable_pin: !PE3
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_x: virtual_endstop
position_min: 0
position_endstop: 355
position_max: 355
homing_speed: 30
homing_retract_dist: 0
homing_positive_dir: True

[tmc2209 stepper_x]
uart_pin: PE1
interpolate: True
run_current: 1.5
sense_resistor: 0.150
stealthchop_threshold: 0
uart_address: 3
driver_sgthrs: 65
diag_pin: PE15

[stepper_y]
step_pin: PB8
dir_pin: !PB6
enable_pin: !PB9
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_y: virtual_endstop
position_min: 0
position_endstop: 364
position_max: 364
homing_speed: 30
homing_retract_dist: 0
homing_positive_dir: True

[tmc2209 stepper_y]
uart_pin: PB7
interpolate: True
run_current: 1.5
sense_resistor: 0.150
stealthchop_threshold: 0
uart_address: 3
driver_sgthrs: 65
diag_pin: PE13

#####################################################################
# Z steppers (quad gantry, homing on the eddy probe)
#####################################################################

[stepper_z] # mainboard: Z3
step_pin: PC0
dir_pin: PE5
enable_pin: !PC1
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16
endstop_pin: probe:z_virtual_endstop
position_max: 347
# Negative so that "tap" probing can reach the bed surface.
position_min: -2
homing_speed: 8.0
homing_retract_dist: 5.0
homing_retract_speed: 15.0

[tmc2209 stepper_z]
uart_pin: PE6
interpolate: True
run_current: 0.58
hold_current: 0.58
sense_resistor: 0.150
stealthchop_threshold: 999999
uart_address: 3

[stepper_z1] # mainboard: Z2
step_pin: PD3
dir_pin: !PD1
enable_pin: !PD4
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16

[tmc2209 stepper_z1]
uart_pin: PD2
interpolate: True
run_current: 0.58
hold_current: 0.58
sense_resistor: 0.150
stealthchop_threshold: 999999
uart_address: 3

[stepper_z2] # mainboard: Z1
step_pin: PD7
dir_pin: PD5
enable_pin: !PB5
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16

[tmc2209 stepper_z2]
uart_pin: PD6
interpolate: True
run_current: 0.58
hold_current: 0.58
sense_resistor: 0.150
stealthchop_threshold: 999999
uart_address: 3

[stepper_z3] # mainboard: Z4
step_pin: PD11
dir_pin: !PD9
enable_pin: !PD12
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16

[tmc2209 stepper_z3]
uart_pin: PD10
interpolate: True
run_current: 0.58
hold_current: 0.58
sense_resistor: 0.150
stealthchop_threshold: 999999
uart_address: 3

#####################################################################
# Extruder and hotend
#####################################################################

[thermistor my_thermistor_e]
temperature1: 25
resistance1: 110000
temperature2: 100
resistance2: 7008
temperature3: 220
resistance3: 435

[extruder]
step_pin: extra_mcu:PA8
dir_pin: extra_mcu:PB8
enable_pin: !extra_mcu:PB11
rotation_distance: 6.5
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
max_extrude_only_distance: 500
heater_pin: extra_mcu:PB9
sensor_type: my_thermistor_e
pullup_resistor: 11500
sensor_pin: extra_mcu:PA5
# Sovol ships min_temp: -250, which disables the open-thermistor check.
# 5 restores it: a disconnected or broken sensor now stops the printer.
min_temp: 5
max_temp: 305
max_power: 1.0
min_extrude_temp: 150
control: pid
pid_kp: 33.838
pid_ki: 5.223
pid_kd: 47.752
pressure_advance: 0.025
pressure_advance_smooth_time: 0.035

[tmc2209 extruder]
uart_pin: extra_mcu:PB10
interpolate: True
run_current: 0.8
hold_current: 0.8
uart_address: 3
sense_resistor: 0.150

[verify_heater extruder]
max_error: 120
check_gain_time: 30
hysteresis: 5
heating_gain: 2

[filament_switch_sensor filament_sensor]
pause_on_runout: True
event_delay: 3.0
pause_delay: 0.5
switch_pin: PE9

#####################################################################
# Heated bed
#####################################################################

[thermistor my_thermistor]
temperature1: 25
resistance1: 100000
temperature2: 50
resistance2: 18085.4
temperature3: 100
resistance3: 5362.6

[heater_bed]
heater_pin: PA0
sensor_type: my_thermistor
sensor_pin: PC5
max_power: 1.0
min_temp: 5
max_temp: 105
control: pid
pid_kp: 73.571
pid_ki: 1.820
pid_kd: 783.849

[verify_heater heater_bed]
max_error: 120
check_gain_time: 40
hysteresis: 5
heating_gain: 2

#####################################################################
# Fans
#####################################################################

# The two part cooling fans act as one native [fan], so M106 and M107
# work without macro overrides.
[multi_pin part_cooling_fans]
pins: extra_mcu:PA7, extra_mcu:PB1

[fan]
pin: multi_pin:part_cooling_fans
max_power: 1.0

# Exhaust fan of Sovol's enclosure kit. Not tested by this guide.
# If you enable it, also enable its line in _ALL_FAN_OFF (macros.cfg).
#[fan_generic exhaust_fan]
#pin: PA2
#max_power: 1.0

[heater_fan hotend_fan]
pin: extra_mcu:PA6
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 45
tachometer_pin: extra_mcu:PA1
tachometer_ppr: 1
tachometer_poll_interval: 0.0013

# Mainboard fan: runs while heaters or X/Y steppers are active, and
# for 5 minutes afterwards. (Sovol's firmware kept it on permanently.)
[controller_fan mcu_fan]
pin: PA1
max_power: 1.0
kick_start_time: 0.5
fan_speed: 1.0
idle_timeout: 300
heater: extruder, heater_bed
stepper: stepper_x, stepper_y

#####################################################################
# Sensors, light
#####################################################################

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor Host_temp]
sensor_type: temperature_host
min_temp: 0
max_temp: 110

[temperature_sensor Toolhead_Temp]
sensor_type: temperature_mcu
sensor_mcu: extra_mcu

[output_pin main_led]
pin: PA3
pwm: True
value: 1
cycle_time: 0.010

#####################################################################
# Resonance measurement and input shaper
#####################################################################
# SHAPER_CALIBRATE followed by SAVE_CONFIG writes the shaper type and
# frequency for each axis at the bottom of this file.

[adxl345]
cs_pin: extra_mcu:PB12
spi_bus: spi2
axes_map: x,z,y

[resonance_tester]
accel_chip: adxl345
probe_points:
    175, 175, 30

[input_shaper]
