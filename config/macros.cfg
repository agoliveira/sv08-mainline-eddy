# Macros.
# PAUSE, RESUME and CANCEL_PRINT come from mainsail.cfg.

[gcode_macro _global_var]
variable_z_maximum_lifting_distance: 345
variable_load_filament_extruder_temp: 250
# Nozzle cleaning and tap
variable_wipe_temp: 200
variable_tap_temp: 150
# Filament pulled back before wiping (mm); the purge line restores it.
variable_clean_retract: 4
# Filament pulled back at the end of a print (mm), to limit the ooze
# that hardens on the nozzle. Keep it well under 8: pulling molten
# filament too far up can jam the hotend.
variable_end_retract: 6
# Height of the wipe relative to the bed surface (Sovol's value).
variable_brush_z: -1.5
# Height of the wipe on the steel strip. It has no give, so it gets its
# own value. -0.8 is what worked on one printer; it is not known to be
# right for yours. Start at 0 and lower it in steps of 0.2, judging it
# at real print starts, not with a cold printer: the reference it is
# measured from shifts a little when hot. See chapter 8 of the guide.
variable_pad_z: -0.8
# Bed mesh method used by START_PRINT: rapid_scan or scan
variable_mesh_method: 'rapid_scan'
gcode:

[gcode_macro BEEP]
gcode:
    SET_PIN PIN=beeper VALUE=1
    G4 P10
    SET_PIN PIN=beeper VALUE=0

[gcode_macro mainled_on]
gcode:
    SET_PIN PIN=main_led VALUE=1

[gcode_macro mainled_off]
gcode:
    SET_PIN PIN=main_led VALUE=0

[gcode_macro _IDLE_TIMEOUT]
gcode:
    {% if printer.print_stats.state == "paused" %}
      RESPOND TYPE=echo MSG="Idle timeout reached while paused, heaters left on."
    {% else %}
      M84
      TURN_OFF_HEATERS
    {% endif %}

[gcode_macro _ALL_FAN_OFF]
gcode:
    M107
    # With the enclosure kit's exhaust fan enabled in printer.cfg, add:
    # SET_FAN_SPEED FAN=exhaust_fan SPEED=0

[gcode_macro START_PRINT]
description: Heat, clean the nozzle, home, level, tap, mesh and purge
gcode:
    {% set v = printer['gcode_macro _global_var'] %}
    {% set bed_temp = params.BED_TEMP|default(60)|float %}
    {% set extruder_temp = params.EXTRUDER_TEMP|default(210)|float %}
    {% set mesh_method = params.MESH_METHOD|default(v.mesh_method) %}
    CLEAR_PAUSE
    BED_MESH_CLEAR
    SET_GCODE_OFFSET Z=0
    M117 Heating bed
    M140 S{bed_temp}
    # The nozzle must not come near the bed before it has been dealt
    # with: plastic left from the previous print would be pressed onto
    # the plate (if cold) or squashed up around the nozzle (if hot).
    # So: home X and Y only, go behind the bed, and soften it there.
    G28 X Y
    G90
    G0 X240 Y360 F9000
    M190 S{bed_temp}
    M117 Clean nozzle
    _NOZZLE_SOFTEN
    # Z is homed only now, with the nozzle hot, so anything still on the
    # tip is soft and cannot load the Z motors against the plate.
    G28 Z
    _BRUSH_Z_REFERENCE
    _NOZZLE_WIPE
    M117 Gantry level
    QUAD_GANTRY_LEVEL
    G28 Z
    M117 Tap
    TAP_HOME
    M117 Bed mesh
    BED_MESH_CALIBRATE METHOD={mesh_method} ADAPTIVE=1
    M117 Purge
    _PURGE_LINE EXTRUDER_TEMP={extruder_temp}
    M117 Printing

# Contactless Z reference taken on the bed right next to the brush.
# With it, the wipe height is correct even when the gantry has not been
# levelled yet.
[gcode_macro _BRUSH_Z_REFERENCE]
gcode:
    G90
    G0 Z10 F600
    G0 X240 Y325 F9000
    PROBE
    _APPLY_PROBE_Z
    G0 Z10 F600

# Stand-alone nozzle cleaning, in the same order as START_PRINT: soften
# the nozzle behind the bed before any Z approach, home Z with the
# nozzle hot, take the height reference beside the brush, then wipe.
# The bed must be clear: X and Y are homed at whatever height the
# toolhead was left at, plus 5 mm. BRUSH_Z can be overridden for a dry
# run, for example: CLEAN_NOZZLE BRUSH_Z=3
[gcode_macro CLEAN_NOZZLE]
gcode:
    G28 X Y
    G90
    G0 X240 Y360 F9000
    _NOZZLE_SOFTEN
    G28 Z
    _BRUSH_Z_REFERENCE
    _NOZZLE_WIPE {rawparams}
    # The reference above moved Z zero to the bed beside the brush.
    # Home Z again so that it is back at the bed center.
    G28 Z

# Stage 1, done behind the bed: heat to wipe temperature, pull the
# filament back so the melt stops feeding the tip, and give leftover
# plastic time to become fully molten. Needs no Z reference.
[gcode_macro _NOZZLE_SOFTEN]
gcode:
    {% set v = printer['gcode_macro _global_var'] %}
    M109 S{v.wipe_temp}
    SAVE_GCODE_STATE NAME=nozzle_soften
    M83
    G1 E-{v.clean_retract} F1800
    RESTORE_GCODE_STATE NAME=nozzle_soften
    G4 P8000

# Stage 2: one pass through the silicone brush while everything on the
# nozzle is molten (stiff, half-set plastic tears its pegs), then wipes
# on the steel strip while the nozzle cools to tap temperature, so what
# still seeps out is removed while it is small.
[gcode_macro _NOZZLE_WIPE]
gcode:
    {% set v = printer['gcode_macro _global_var'] %}
    {% set bz = params.BRUSH_Z|default(v.brush_z)|float %}
    {% set pz = params.PAD_Z|default(v.pad_z)|float %}
    {% if params.BRUSH_Z is defined and params.PAD_Z is not defined %}
        {% set pz = bz %}
    {% endif %}
    _WIPE_BRUSH Z={bz}
    M106 S255
    M104 S{v.tap_temp}
    _WIPE_PAD Z={pz}
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={v.tap_temp + 30}
    _WIPE_PAD Z={pz}
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={v.tap_temp + 15}
    _WIPE_PAD Z={pz}
    M109 S{v.tap_temp}
    _WIPE_PAD Z={pz}
    M107
    G90
    G0 Z10 F600

[gcode_macro _WIPE_BRUSH]
gcode:
    {% set z = params.Z|float %}
    G90
    G0 X240 Y360 F9000
    G1 Z{z} F600
    G1 X245 F4800
    G1 X271 Y358
    G1 X245
    G1 X271 Y358
    G1 X255
    G1 X271 Y360
    G1 X255
    G1 X271 Y360
    G1 X245
    G1 X271 Y362
    G1 X245
    G1 X271 Y362
    G1 X255
    G1 X271 Y363
    G1 X255
    G1 X271 Y362
    G1 Z{z + 5} F600

[gcode_macro _WIPE_PAD]
gcode:
    {% set z = params.Z|float %}
    G90
    G0 X310 Y359 F4000
    G1 Z{z} F600
    G1 X313 F4800
    G1 X310
    G1 X313
    G1 X310
    G1 X313
    G1 X310
    G1 Z{z + 5} F600

# Touches the bed with the nozzle at the mesh zero reference point and
# makes that contact point Z=0. Needs a clean nozzle.
[gcode_macro TAP_HOME]
gcode:
    G90
    G0 Z5 F600
    G0 X191 Y165 F9000
    PROBE METHOD=tap SAMPLES=3 SAMPLES_TOLERANCE=0.02 SAMPLES_TOLERANCE_RETRIES=3
    _APPLY_PROBE_Z
    G0 Z5 F600

# Makes the bed surface found by the last PROBE the new Z=0.
# Separate macro on purpose: its template is evaluated after the PROBE
# that precedes it has run, so it sees that probe's result.
[gcode_macro _APPLY_PROBE_Z]
gcode:
    {% set probe_z = printer.probe.last_probe_position.z|float %}
    {% set cur_z = printer.toolhead.position.z|float %}
    SET_KINEMATIC_POSITION Z={cur_z - probe_z}
    {action_respond_info("Probe: bed surface was at Z=%.4f, Z zero updated." % probe_z)}

# Purge line just in front of the area being printed (from the object
# outlines the slicer provides), or at the front left of the bed when
# no object information is available.
[gcode_macro _PURGE_LINE]
gcode:
    {% set extruder_temp = params.EXTRUDER_TEMP|default(210)|float %}
    # Prime length: both retractions (end of the previous print and the
    # cleaning step) plus 6 mm.
    {% set gv = printer['gcode_macro _global_var'] %}
    {% set prime = gv.clean_retract + gv.end_retract + 6 %}
    {% set ns = namespace(minx=9999.0, miny=9999.0) %}
    {% for obj in printer.exclude_object.objects %}
        {% for pt in obj.polygon %}
            {% if pt[0] < ns.minx %}{% set ns.minx = pt[0] %}{% endif %}
            {% if pt[1] < ns.miny %}{% set ns.miny = pt[1] %}{% endif %}
        {% endfor %}
    {% endfor %}
    {% if ns.minx > 9000 %}
        {% set ns.minx = 20.0 %}
        {% set ns.miny = 15.0 %}
    {% endif %}
    {% set x0 = [[ns.minx, 5.0]|max, 275.0]|min %}
    {% set y0 = [[ns.miny - 10.0, 3.0]|max, 340.0]|min %}
    G90
    G0 Z5 F600
    G0 X{x0} Y{y0} F9000
    M109 S{extruder_temp}
    M82
    G92 E0
    G1 Z0.4 F600
    # Prime in place: refills the nozzle after the cleaning retraction
    # and anchors the line.
    G1 E{prime} F300
    # Thick 60 mm line, then a quick wipe move without extruding.
    G1 X{x0 + 60} E{prime + 12} F600
    G1 X{x0 + 70} F6000
    G92 E0
    G0 Z2 F600

[gcode_macro END_PRINT]
gcode:
    {% set z_max = printer['gcode_macro _global_var'].z_maximum_lifting_distance|int %}
    {% set e_mintemp = printer.configfile.settings['extruder'].min_extrude_temp %}
    {% set end_retract = printer['gcode_macro _global_var'].end_retract|float %}
    M117 Finish Print!!!
    {% if printer.toolhead.homed_axes|lower == "xyz" %}
        G91
        {% if printer.extruder.temperature >= e_mintemp %}
            G1 E-{end_retract / 2} F2700
            G1 E-{end_retract / 2} Z0.2 F2400
        {% endif %}
        {% if (printer.gcode_move.position.z + 10) < z_max %}
            G1 Z+10 F3000
        {% else %}
            G1 Z+{(z_max - printer.gcode_move.position.z)} F3000
        {% endif %}
        G90
        G1 X0 Y350 F9000
    {% endif %}
    _ALL_FAN_OFF
    TURN_OFF_HEATERS
    M220 S100
    M221 S100
    CLEAR_PAUSE
    M84 X Y Z E
    {action_respond_info("Finish Print!")}

[gcode_macro LOAD_FILAMENT]
gcode:
    {% set extruder_temp = printer['gcode_macro _global_var'].load_filament_extruder_temp|int %}
    {% set current_target_temp = printer.extruder.target|int %}
    {% if printer.print_stats.state != "printing" %}
        {% if printer.print_stats.state != "paused" or printer.extruder.target == 0 %}
            {action_respond_info("Nozzle heating")}
            M109 S{extruder_temp}
        {% else %}
            {action_respond_info("Nozzle heating")}
            M109 S{printer.extruder.target}
        {% endif %}
        G91
        G1 E45 F300
        G1 E30 F150
        G90
        M400
        {% if current_target_temp == 0 or printer.print_stats.state != "paused" %}
            M104 S0
        {% endif %}
    {% else %}
        {action_respond_info("Don't load filament during printing!!!")}
    {% endif %}

[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% set extruder_temp = printer['gcode_macro _global_var'].load_filament_extruder_temp|int %}
    {% set current_target_temp = printer.extruder.target|int %}
    {% if printer.print_stats.state != "printing" %}
        {% if printer.print_stats.state != "paused" or printer.extruder.target == 0 %}
            {action_respond_info("Nozzle heating")}
            M109 S{extruder_temp}
        {% else %}
            {action_respond_info("Nozzle heating")}
            M109 S{printer.extruder.target}
        {% endif %}
        G91
        G1 E+25 F300
        M400
        G1 E-10 F1500
        G1 E-20 F600
        G4 P3000
        M400
        G1 E-50 F300
        G90
        M400
        {% if current_target_temp == 0 or printer.print_stats.state != "paused" %}
            M104 S0
        {% endif %}
    {% else %}
        {action_respond_info("Don't unload filament during printing!!!")}
    {% endif %}

# Sovol's M109/M190: wait until the temperature is within a small
# window of the target instead of Klipper's stricter default wait.
[gcode_macro M109]
rename_existing: M99109
gcode:
    {% set s = params.S|float %}
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s-1} MAXIMUM={s+2}
    {% endif %}

[gcode_macro M190]
rename_existing: M99190
gcode:
    {% set s = params.S|float %}
    M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s-1} MAXIMUM={s+2}
    {% endif %}

[gcode_macro M600]
gcode:
    PAUSE
